<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">

    <script defer src="scripts/quickerlinksSettings.js"></script>
    <script defer src="scripts/dropdowns.js"></script>
		<script defer src="scripts/home.js"></script>
    <link rel="stylesheet" href="styles/quickerlinks.css">
		<link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/bootstrap.min.css">
	</head>
	<body>
		<div >
			<div id="homeHeader" class="container-fluid homeHeader">
				<div class="pull-right settingsIcon">
					<button id="toggleSearch" class="searchButton" type="button" aria-label="Search courses" title="Search courses" aria-controls="courseSearch" aria-expanded="false">
						<span class="glyphicon glyphicon-search headerGlyphicons" aria-hidden="true"></span>
					</button>
					<a href="settings.html" aria-label="Settings" title="Settings">
						<span class="glyphicon glyphicon-cog headerGlyphicons" aria-hidden="true">
						</span>
					</a>
				</div>
				<div class="myCourses pull-left">
					<h1>My Courses</h1>
				</div>
			</div>
			<div class="container-fluid">
				<div tabindex="1"></div>
				<div id="courseSearch" class="courseSearch" hidden>
					<label class="sr-only" for="courseSearchInput">Search courses</label>
					<input id="courseSearchInput" class="form-control" type="search" placeholder="Search courses" autocomplete="off" aria-controls="home">
					<button id="cancelSearch" class="searchButton cancelSearch" type="button" aria-label="Cancel search" title="Cancel search">
						<span class="glyphicon glyphicon-remove-circle" aria-hidden="true"></span>
					</button>
				</div>
				<p id="searchStatus" role="status" hidden>No matching courses.</p>
				<div id="home"></div>
			</div>
		</div>
	</body>

</html>
